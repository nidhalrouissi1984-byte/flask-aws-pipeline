
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  build:
    commands:
      - python -m py_compile app.py
      - python -c "from app import app; client = app.test_client(); response = client.get('/health'); assert response.status_code == 200; assert response.json['status'] == 'healthy'; print('Tests passed!')"
